name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build & Publish Release Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package Release Archive
        run: |
          mkdir -p release-pkg
          cp -r clean.sh restore.sh launcher profiles docs README.md LICENSE release-pkg/
          tar -czf firetv-clean-root-${{ github.ref_name }}.tar.gz -C release-pkg .
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            firetv-clean-root-${{ github.ref_name }}.tar.gz
            launcher/cleanyourtv-release.apk
          generate_release_notes: true
